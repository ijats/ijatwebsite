# =============================================================================
# IJATS Editor Console configuration (Sveltia CMS)
#
# This drives the /admin console. Editors sign in, fill in the forms below, and
# their changes are committed to the repository — which rebuilds and publishes
# the site automatically.
#
# SIGNING IN (two options):
#   1. Personal Access Token — works immediately, no extra setup. Click
#      "Sign In Using Access Token" and paste a GitHub token with `repo` scope.
#      Recommended for a single editor. (See DEPLOYMENT.md → "Admin login".)
#   2. One-click "Sign In with GitHub" (nicer for several editors) — deploy the
#      Cloudflare Worker in oauth-worker/, then uncomment `base_url` below and
#      set it to the worker's URL.
# =============================================================================

backend:
  name: github
  repo: ijats/ijatwebsite
  # REVIEW PHASE: edits target the review branch so they never touch the live
  # site. ⚠️ AT GO-LIVE: once this branch is merged into the default branch,
  # delete this `branch:` line (it then auto-detects the default branch).
  branch: rebuild-astro
  #
  # For one-click GitHub OAuth, deploy oauth-worker/ and set this to its URL:
  # base_url: https://ijats-cms-auth.<your-subdomain>.workers.dev

# Uploaded PDFs and cover images land here in the repo...
media_folder: public/pdfs
# ...and are referenced from the site by this public path.
public_folder: /pdfs

# Friendlier labels in the UI.
site_url: https://ijats.org
logo_url: /logo.svg

collections:
  # ---------------------------------------------------------------------------
  # ISSUES — create one per edition (monthly, quarterly, etc.). Create the
  # issue first, then add Articles that reference it.
  # ---------------------------------------------------------------------------
  - name: issues
    label: Issues
    label_singular: Issue
    folder: src/content/issues
    create: true
    # Files are named e.g. vol-1-issue-1.md, matching the article relation.
    slug: 'vol-{{fields.volume}}-issue-{{fields.issue}}'
    summary: 'Vol. {{fields.volume}}, No. {{fields.issue}} — {{fields.title}}'
    sortable_fields: [volume, issue, publishDate]
    fields:
      - { name: volume, label: Volume, widget: number, value_type: int, min: 1 }
      - { name: issue, label: Issue number, widget: number, value_type: int, min: 1 }
      - {
          name: title,
          label: Issue title,
          widget: string,
          required: false,
          hint: 'Optional label such as "Spring 2026" or "Inaugural Issue".',
        }
      - {
          name: publishDate,
          label: Publication date,
          widget: datetime,
          time_format: false,
          format: 'YYYY-MM-DD',
          date_format: 'YYYY-MM-DD',
        }
      - {
          name: status,
          label: Status,
          widget: select,
          options: [draft, published],
          default: draft,
          hint: 'Only "published" issues appear on the public site.',
        }
      - {
          name: summary,
          label: Summary,
          widget: text,
          required: false,
          hint: 'A short description shown on the issue card and page.',
        }
      - {
          name: coverImage,
          label: Cover image,
          widget: image,
          required: false,
          hint: 'Optional. If omitted, a styled Vol/No cover is generated.',
        }
      - {
          name: fullIssuePdf,
          label: Full-issue PDF,
          widget: file,
          required: false,
          hint: 'Optional single PDF of the entire issue.',
        }

  # ---------------------------------------------------------------------------
  # ARTICLES — one per paper. Each has its own PDF and citation metadata.
  # ---------------------------------------------------------------------------
  - name: articles
    label: Articles
    label_singular: Article
    folder: src/content/articles
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [publishDate, order, title]
    fields:
      - { name: title, label: Title, widget: string }
      - {
          name: authors,
          label: Authors,
          widget: list,
          field: { name: author, label: Author, widget: string },
          hint: 'Add each author separately, in citation order.',
        }
      - { name: abstract, label: Abstract, widget: text }
      - {
          name: keywords,
          label: Keywords,
          widget: list,
          required: false,
          field: { name: keyword, label: Keyword, widget: string },
        }
      - { name: startPage, label: Start page, widget: number, value_type: int, required: false, min: 1 }
      - { name: endPage, label: End page, widget: number, value_type: int, required: false, min: 1 }
      - {
          name: pdf,
          label: Article PDF,
          widget: file,
          hint: 'Upload the article PDF.',
        }
      - { name: doi, label: DOI, widget: string, required: false, hint: 'Optional, e.g. 10.1234/ijats.2026.001' }
      - {
          name: issue,
          label: Issue,
          widget: relation,
          collection: issues,
          value_field: '{{slug}}',
          search_fields: [title, volume],
          display_fields: ['{{title}}'],
          hint: 'Which issue this article belongs to. Create the issue first.',
        }
      - {
          name: order,
          label: Order in issue,
          widget: number,
          value_type: int,
          default: 0,
          hint: 'Lower numbers appear first in the table of contents.',
        }
      - {
          name: publishDate,
          label: Publication date,
          widget: datetime,
          time_format: false,
          format: 'YYYY-MM-DD',
          date_format: 'YYYY-MM-DD',
        }
      - {
          name: status,
          label: Status,
          widget: select,
          options: [draft, published],
          default: draft,
        }
